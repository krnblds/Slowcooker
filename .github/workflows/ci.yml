name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build dashboard
        working-directory: dashboard
        run: npm ci && npm run build
      - name: Test dashboard kit
        working-directory: dashboard
        run: npm test
      - name: Restore
        run: dotnet restore
      - name: Format
        run: dotnet format --no-restore --verify-no-changes
      - name: Build
        run: dotnet build --no-restore --configuration Release -p:SkipDashboardBuild=true
      # Try-out packages for every CI run (version 0.x.y-ci.N), downloadable from the run's summary page.
      - name: Pack
        run: dotnet pack Slowcooker.sln --no-build --configuration Release -p:SkipDashboardBuild=true -p:VersionSuffix=ci.${{ github.run_number }} -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
          retention-days: 14
      # Postgres and Redis suites start their own containers through Testcontainers (Docker is available on ubuntu runners).
      - name: Test
        run: dotnet test --no-build --configuration Release --solution Slowcooker.sln
