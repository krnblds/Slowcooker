name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      # Postgres and Redis suites start their own containers through Testcontainers (Docker is available on ubuntu runners).
      - name: Test
        run: dotnet test --no-build --configuration Release --solution Slowcooker.sln
