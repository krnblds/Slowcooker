name: Release

# Tag a commit vX.Y.Z and push the tag: the packages are built from the tag, pushed to NuGet and attached to a
# GitHub release with generated notes. Needs a NUGET_API_KEY repository secret.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      - name: Test
        run: dotnet test --solution Slowcooker.sln --configuration Release -p:SkipDashboardBuild=true -p:Version=$VERSION

      - name: Pack
        run: dotnet pack Slowcooker.sln --configuration Release --no-build -p:SkipDashboardBuild=true -p:Version=$VERSION -o artifacts

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
