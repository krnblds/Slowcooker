name: Release

# Two ways to publish:
#
#   git tag v0.2.0 && git push origin v0.2.0                  stable release
#   git tag v0.2.0-beta.1 && git push origin v0.2.0-beta.1    prerelease (beta, preview, rc, ...)
#
# or run the workflow by hand (Actions > Release > Run workflow) with a version such as 0.2.0-preview.3 from any
# branch: it tags that commit and publishes the same way. Anything with a SemVer suffix is pushed to NuGet as a
# prerelease (hidden unless --prerelease is used) and the GitHub release is marked pre-release.
# Needs a NUGET_API_KEY secret; the "nuget" environment can require reviewers before the push.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0-preview.1 (no leading v)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::'$version' is not a SemVer 2 version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "Publishing $version (prerelease: $prerelease)"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      - name: Test
        run: dotnet test --solution Slowcooker.sln --configuration Release -p:SkipDashboardBuild=true -p:Version=$VERSION

      - name: Pack
        run: dotnet pack Slowcooker.sln --configuration Release --no-build -p:SkipDashboardBuild=true -p:Version=$VERSION -o artifacts

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          files: artifacts/*
          generate_release_notes: true
