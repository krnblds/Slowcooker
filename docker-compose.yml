# Local Postgres and Redis for the sample and for manual testing.
#   docker compose up -d
#   dotnet run --project samples/Slowcooker.Samples.WebApi -- --Slowcooker:Storage=Postgres
# The test suites do not need this file: they start their own containers with Testcontainers.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: slowcooker
      POSTGRES_PASSWORD: slowcooker
      POSTGRES_DB: slowcooker
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slowcooker"]
      interval: 5s
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
